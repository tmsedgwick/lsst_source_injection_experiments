[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lsst_source_injection_experiments"
version = "0.1.0"
description = "Inject synthetic galaxies into LSST deep coadds or their exposures and measure detection and deblending"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Sedgwick", email = "t.m.sedgwick@outlook.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyarrow>=14", "scikit-learn>=1.3", "matplotlib>=3.8",
                "h5py>=3.8", "astropy>=6.0", "reproject>=0.13"]

[tool.setuptools.packages.find]
include = ["lsst_source_injection_experiments*"]

[tool.ruff]
line-length = 120
